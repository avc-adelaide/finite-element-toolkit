
[project]
name = "finite-element-toolkit"
version = "0.1"
requires-python = ">=3.12,<3.14"

dependencies = [
  "matplotlib",
  "jupyter",
]

[tool.setuptools]
packages = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
finite-element-toolkit = { path = ".", editable = true }

[tool.pixi.tasks]
install = "uv pip install -e . --system --no-deps"

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
fenics-dolfinx = "*"
mpich = "*"
pyvista = "*"
python-gmsh = "*"
cadquery = "*"
meshio = "*"
mpi4py = "*"
h5py = "*"
