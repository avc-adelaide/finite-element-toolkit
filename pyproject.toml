
[project]
name = "finite-element-toolkit"
version = "0.1"
requires-python = "==3.13.*"

dependencies = [
  "matplotlib",
  "jupyter",
  "cadquery>=2.3.0",
  "gmsh",
  "meshio",
  "mpi4py",
  "h5py>=3.16.0",
  "pyvista>=0.47.1",
]

[tool.setuptools]
packages = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
finite-element-toolkit = { path = ".", editable = true }

[tool.pixi.tasks]
install = "uv pip install -e . --system --no-deps"

[tool.pixi.dependencies]
python = ">=3.13,<3.14"
fenics-dolfinx = "*"
mpich = "*"
pyvista = "*"
gmsh = ">=4.15.0,<5"
